name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build on every event, so a pull request still catches a broken docs build.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v7.1.4
      with:
        version: "latest"
    - name: Set up Python
      run: uv python install
    - name: Install pandoc
      run: sudo apt-get update && sudo apt-get install -y pandoc
    - name: Install dependencies
      run: uv sync --group docs
    - name: Build documentation
      run: |
        cd docs
        uv run sphinx-build -b html . build/html
    - name: Setup Pages
      if: github.event_name == 'push'
      uses: actions/configure-pages@v5
    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs/build/html'

  # Deploy only on a push to main. Binding the github-pages environment on a
  # pull_request made the job fail at startup, before any step ran and with no
  # log to read, so every PR showed a red "docs" check while the docs built
  # fine.
  deploy:
    needs: build
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
